<!doctype html>
<!-- Web version of false_memory.py: same steps, same material (material.json), same data columns.
     Layout copies expyriment: black screen, grey text (150,150,150), text size = screen height / 40,
     word size = screen height / 12, text screens in a box of 80 % of the screen with the text
     starting at 1/5 of the box. The font is the browser's Helvetica/Arial (expyriment: FreeSans). -->
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listes de mots / Word lists</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; color: rgb(150, 150, 150);
               font-family: Helvetica, Arial, sans-serif; font-size: max(20px, 2.5vh); cursor: none; }
  #line { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #page { position: absolute; left: 10vw; top: 10vh; width: 80vw; height: 80vh; text-align: center; }
  #heading { font-size: 1.3em; }
  #text { position: absolute; top: 20%; width: 100%; white-space: pre-line; }
  .word { font-size: calc(100vh / 12); }
  a { color: inherit; }
  [hidden] { display: none !important; }    /* #line is a flex box, which would ignore "hidden" */
</style>
<div id="line"></div>
<div id="page"><div id="heading"></div><div id="text"></div></div>
<script>
// Experiment ID given by https://pipe.jspsych.org (it stores each run in your OSF project).
// Empty: nothing is sent and the participant is offered the data file as a download.
const DATAPIPE_ID = "Q1FHWT90LwOi";

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const painted = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

function line(text, cls = "") {            // like stimuli.TextLine(...).present(); "" = blank screen
  $("page").hidden = true; $("line").hidden = false;
  $("line").className = cls; $("line").textContent = text;
}
function page(heading, text) {             // like stimuli.TextScreen(heading, text).present()
  $("line").hidden = true; $("page").hidden = false;
  $("heading").textContent = heading; $("text").textContent = text;
}
async function key(allowed) {              // like exp.keyboard.wait(keys): returns [key, ms]
  await painted();
  const start = performance.now();
  return new Promise(resolve => addEventListener("keydown", function handler(event) {
    const k = event.key.toLowerCase();
    if (allowed && !allowed.includes(k)) return;
    removeEventListener("keydown", handler);
    resolve([k, Math.round(performance.now() - start)]);
  }));
}
function shuffle(a) {                      // Fisher-Yates, as random.shuffle
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function results(answers) {                // same as results() in false_memory.py
  const values = {};
  for (const [name, kinds] of [["hits", ["studied_word"]], ["lures", ["studied_lure"]],
                               ["fa", ["unstudied_word", "unstudied_lure"]]]) {
    const said = answers.filter(a => kinds.includes(a[2])).map(a => a[3]);
    const yes = said.filter(Boolean).length;
    Object.assign(values, { [name]: yes, ["n_" + name]: said.length,
                            ["p_" + name]: Math.round(100 * yes / said.length) });
  }
  const words = answers.filter(a => a[2] === "studied_lure" && a[3]).map(a => a[0]);
  values.lure_words = words.length ? `(${words.join(", ")})` : "";
  return values;
}
console.assert(JSON.stringify(results([["bed", "sleep", "studied_word", true], ["rest", "sleep", "studied_word", false],
  ["sleep", "sleep", "studied_lure", true], ["hot", "cold", "unstudied_word", false], ["cold", "cold", "unstudied_lure", true]]))
  === '{"hits":1,"n_hits":2,"p_hits":50,"lures":1,"n_lures":1,"p_lures":100,"fa":1,"n_fa":2,"p_fa":50,"lure_words":"(sleep)"}');
function makeTest(M, lists, studied) {     // same as make_test() in false_memory.py
  const items = [];
  for (const [lure, words] of Object.entries(lists)) {
    const group = studied.includes(lure) ? "studied" : "unstudied";
    for (const p of M.test_positions) items.push([words[p - 1], lure, group + "_word"]);
    items.push([lure, lure, group + "_lure"]);
  }
  return shuffle(items);
}

async function run() {
  const M = await (await fetch("material.json")).json();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const rows = [];

  page("", M.choose);
  const language = (await key(["f", "e"]))[0] === "f" ? "fr" : "en";
  document.documentElement.requestFullscreen?.().catch(() => {});
  const T = M[language];
  const chosen = shuffle(Object.keys(T.lists)).slice(0, M.n_lists);   // a different set of lists for each person
  const lists = Object.fromEntries(chosen.map(lure => [lure, T.lists[lure].split(" ").slice(0, M.list_length)]));
  const check = makeTest(M, lists, chosen.slice(0, M.n_lists / 2));
  console.assert(check.length === 4 * M.n_lists && check.filter(i => i[2] === "studied_lure").length === M.n_lists / 2);

  page(...T.study);
  await key();

  const studied = shuffle(Object.keys(lists)).slice(0, M.n_lists / 2);
  for (const [n, lure] of studied.entries()) {
    line(T.list.replace("{}", n + 1).replace("{}", studied.length));
    await sleep(M.list_pause_ms);
    for (const word of lists[lure]) {
      line(word, "word");
      await sleep(M.word_ms);
      line("");
      await sleep(M.gap_ms);
      rows.push([id, "study", word, lure, "studied_word", "", ""]);
    }
  }

  page(...T.test);
  await key();

  const answers = [];
  for (const [word, lure, kind] of makeTest(M, lists, studied)) {
    line("");
    await sleep(M.test_blank_ms);
    line(word, "word");
    const [k, rt] = await key(["f", "j"]);
    rows.push([id, "test", word, lure, kind, k === "f" ? "True" : "False", rt]);
    answers.push([word, lure, kind, k === "f"]);
  }

  // Same layout as expyriment's .xpd file: comment lines, a header line, one line per event.
  const data = [`#e language: ${language}`, `#e version: ${M.version}`, "#e source: web", `#date: ${new Date().toISOString()}`,
                `#screen: ${screen.width}x${screen.height}`, `#browser: ${navigator.userAgent}`,
                "subject_id,phase,word,list,kind,said_old,rt",
                ...rows.map(r => r.join(","))].join("\n") + "\n";
  const filename = `false_memory_web_${id}.xpd`;
  // Send now, while the participant reads the results, so closing the page then loses nothing.
  const sending = !DATAPIPE_ID ? Promise.resolve(false) : fetch("https://pipe.jspsych.org/api/data/", {
    method: "POST", headers: { "Content-Type": "application/json", Accept: "*/*" },
    body: JSON.stringify({ experimentID: DATAPIPE_ID, filename, data }),
  }).then(response => response.ok, () => false);   // offline or blocked: offer the download
  const values = results(answers);
  page(T.results[0], T.results[1].replace(/\{(\w+)\}/g, (_, name) => values[name]));
  await key();
  page("", T.saving);
  const sent = await sending;
  document.exitFullscreen?.().catch(() => {});
  document.body.style.cursor = "auto";
  page(T.end, sent ? T.saved : "");
  if (!sent) {
    const link = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(new Blob([data], { type: "text/plain" })),
      download: filename, textContent: T.download });
    $("text").append(link);
  }
}
run();
</script>
</html>
